name: ROM visibility and deletion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Jawaka
      - uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Catastrophe
          # Font-size viewport checks need the merged font-path self-copy fix (#18).
          ref: cb2bdffa2c6b51b2fdb49262bc1efeddf87e0db1
          path: Catastrophe
      - name: Install native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsqlite3-dev libcurl4-openssl-dev
      - name: Content inspection, database migration, visibility and relocation
        run: make -C Jawaka content-test delete-test deletion-db-test schema-v6-test visibility-test relocation-test
      - name: Launcher, Hidden Games and empty in-game switcher
        run: make -C Jawaka delete-ui-test visibility-ui-test settings-status-test game-switcher-test
      - name: Deletion preview and delete IPC
        run: make -C Jawaka delete-client-test rom-delete-ipc-smoke
