name: Native PICO-8 launch policy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make pico8-test
      - run: make osd-game-launch-test
      - run: make osd-view-test
      - run: make osd-layout-test
      - run: make osd-client-test
