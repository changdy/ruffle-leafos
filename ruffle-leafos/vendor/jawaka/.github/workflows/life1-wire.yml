name: LIFE-1 wire compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c-wire-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jawaka
        uses: actions/checkout@v4
        with:
          path: Jawaka

      - name: Verify fork-safe C protocol behavior
        run: make -C Jawaka ctl1-test life1-test ipc-stream-test

      - name: Check out the pinned service contracts
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/leaf-contracts
          ref: b74130056342efdd6bdeb9ed7204968dd294fbde
          path: leaf-contracts

      - name: Verify C framing against canonical fixtures
        run: make -C Jawaka WORKSPACE_ROOT="$GITHUB_WORKSPACE" wire-fixture-test

      - name: Verify content manifests against canonical fixtures
        run: make -C Jawaka content-manifest-test catalog-merge-test content-art-test catalog-effective-test catalog-folder-test

      - name: Verify system display names and rename precedence
        run: make -C Jawaka system-names-test

  wordmark-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Jawaka
      - name: Check out the pinned UI toolkit
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Catastrophe
          ref: d06f22cd9919fb516749018fe5cd9bf942fc3fef
          path: Catastrophe
      - name: Install native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsqlite3-dev libcurl4-openssl-dev
      - name: Verify wordmark and grid fallback with the real loader
        run: make -C Jawaka wordmark-test
