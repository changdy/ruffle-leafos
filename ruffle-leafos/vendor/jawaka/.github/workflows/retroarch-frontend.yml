name: RetroArch frontend (LEAF-RA-1)

# A content pak's own RetroArch, launched in place of Leaf's.
#
#   1. catalog-frontend-test: the loader keeps a core's "frontend" only from a
#      pak row with the leaf-ra-1 protocol, and the resolver returns the
#      absolute path of an executable regular file under APPS_PATH or
#      <sdcard>/Apps (-1 otherwise).
#   2. catalog-effective-test: a declared frontend is a CAT-1 declared file, so
#      replacing it moves the catalog generation.
#   3. retroarch-config-test: the frontend profile (no recording, PulseAudio on
#      Bluetooth) in both platform shapes; retroarch-command-test: VERSION is
#      an allowed command.
#   4. retroarch-frontend-ipc-smoke: a real jawakad launches the fixture pak's
#      frontend, probes it (GET_INFO, then VERSION against the build manifest),
#      refuses the in-game menu until the probe passes, and promotes the
#      session config only for a matching version.
#
# The manifest and merge fixtures for the contract itself run in the LIFE-1
# wire workflow, against the pinned leaf-contracts.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make catalog-frontend-test catalog-effective-test
      - run: make retroarch-config-test retroarch-command-test

  # A real jawakad with a fake RetroArch; separate so an apt hiccup cannot fail
  # the pure tests. Takes about a minute: one row waits out the ~20 s probe
  # window.
  ipc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev
      - run: make retroarch-frontend-ipc-smoke
