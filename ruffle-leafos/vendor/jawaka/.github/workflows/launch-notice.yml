name: Launch notice
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make launch-notice-test

  renderer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Jawaka
      - name: Check out the pinned UI toolkit
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Catastrophe
          ref: 42cbc368600994608debc6accd266de6abad19e2
          path: Catastrophe
      - name: Install native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsqlite3-dev libcurl4-openssl-dev
      - run: make -C Jawaka launch-notice-ui-test
      - run: make -C Jawaka osd-banner-ui-test
