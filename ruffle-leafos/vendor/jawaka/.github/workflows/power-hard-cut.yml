name: Force Off Hold

# Settings > System > Force Off Hold maps 6/8/10/12 s onto RK817 register 0xf7
# bits 5:4. This pins the mapping, the 10 s default for a missing or invalid
# stored value, and that the rewrite leaves the other bits alone.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make power-hard-cut-test
